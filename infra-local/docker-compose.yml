# Root docker-compose — starts ALL services locally
# Usage:
#   cp backend/.env.example backend/.env
#   docker compose up -d
# For dev (live reload): docker compose --profile dev up -d

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: chat-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: chat-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: chatadmin
      MINIO_ROOT_PASSWORD: changeme123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Init (run once to create bucket) ───────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: chat-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set local http://minio:9000 chatadmin changeme123 &&
      mc mb local/chat-media --ignore-existing &&
      mc anonymous set download local/chat-media &&
      echo '[MinIO] Bucket ready' &&
      exit 0
      "
    profiles:
      - init
    # Run once: docker compose --profile init up
    # Or just: docker compose run --rm minio-init

  # ── Coturn (STUN/TURN for WebRTC) ─────────────────────────────────────────────
  coturn:
    image: coturn/coturn:4
    container_name: chat-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
    volumes:
      - ./storage/turnserver.conf:/etc/coturn/turnserver.conf:ro
    network_mode: host
    # NOTE: network_mode: host requires Linux/macOS or WSL2.
    # On Windows without WSL2, coturn will not work locally.

  # ── Backend (production build) ───────────────────────────────────────────────
  backend:
    build:
      context: ../chat-backend
      dockerfile: ../infra-local/backend/Dockerfile
    container_name: chat-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://chat-mongodb:27017/chat
      REDIS_URL: redis://chat-redis:6379
      MINIO_ENDPOINT: chat-minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: chatadmin
      MINIO_ROOT_PASSWORD: changeme123
      MINIO_BUCKET: chat-media
      COTURN_IP: localhost
      COTURN_PORT: "3478"
      TURN_STATIC_SECRET: your-turn-secret-here
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Backend Dev (live reload — run with: docker compose --profile dev up) ──────
  backend-dev:
    image: node:20-alpine
    container_name: chat-backend-dev
    working_dir: /app
    volumes:
      - ../chat-backend/src:/app/src
      - ../chat-backend/node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://chat-mongodb:27017/chat
      REDIS_URL: redis://chat-redis:6379
      MINIO_ENDPOINT: chat-minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_ROOT_USER: chatadmin
      MINIO_ROOT_PASSWORD: changeme123
      MINIO_BUCKET: chat-media
      COTURN_IP: localhost
      COTURN_PORT: "3478"
      TURN_STATIC_SECRET: your-turn-secret-here
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - dev

volumes:
  mongodb_data:
  redis_data:
  minio_data:
