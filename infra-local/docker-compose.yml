# Root docker-compose — starts ALL services locally
# Usage:
#   cp backend/.env.example backend/.env
#   docker compose up -d
# For dev (live reload): docker compose --profile dev up -d

services:
  # ── MongoDB ──────────────────────────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: chat-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chat-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: chat-minio
    restart: unless-stopped
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Console UI
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: chatadmin
      MINIO_ROOT_PASSWORD: changeme123
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MinIO Init (run once to create bucket) ───────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: chat-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 5 &&
      mc alias set local http://minio:9000 chatadmin changeme123 &&
      mc mb local/chat-media --ignore-existing &&
      mc anonymous set download local/chat-media &&
      echo '[MinIO] Bucket ready' &&
      exit 0
      "
    profiles:
      - init
    # Run once: docker compose --profile init up
    # Or just: docker compose run --rm minio-init

  # ── Coturn (STUN/TURN for WebRTC) ─────────────────────────────────────────────
  coturn:
    image: coturn/coturn:4
    container_name: chat-coturn
    restart: unless-stopped
    volumes:
      - ./storage/turnserver.conf:/etc/coturn/turnserver.conf:ro
    # ── Networking ───────────────────────────────────────────────────────────
    # Option A (Linux / macOS / WSL2) — host networking is simplest and avoids
    # NAT'ing the relay ports. Comment out the `ports:` block below if you use
    # this. On Windows Docker Desktop WITHOUT WSL2, host networking does NOT
    # work — use Option B and run calls from WSL2 or a Linux/VPS host.
    # network_mode: host
    #
    # Option B (bridge networking, Windows-friendly) — publish the signalling
    # port AND the relay range declared in turnserver.conf (min-port/max-port).
    # Publishing the relay range is what lets media actually flow; without it
    # TURN allocations succeed but the relayed stream is dropped.
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "49160-49200:49160-49200/udp"
    # Coturn does NOT read env vars on its own, but CLI flags OVERRIDE the conf
    # file. We drive the three peer-dependent values from the SAME env vars the
    # backend uses, so there is one source of truth and no manual conf editing:
    #   - external-ip / realm  ← COTURN_IP  (host LAN IP in dev, public IP in prod)
    #   - static-auth-secret   ← TURN_STATIC_SECRET (must match the backend)
    # Defaults below keep `docker compose up` working out-of-the-box for same-LAN
    # dev. For cross-NAT/prod, set COTURN_IP + TURN_STATIC_SECRET in your shell
    # or infra-local/.env. The literal values in turnserver.conf are only used if
    # you run coturn standalone without these flags.
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --external-ip=${COTURN_IP:-127.0.0.1}
      - --realm=${COTURN_IP:-127.0.0.1}
      - --static-auth-secret=${TURN_STATIC_SECRET:-koola-turn-secret-dev-2024}

  # ── Backend (production build) ───────────────────────────────────────────────
  backend:
    build:
      context: ../chat-backend
      dockerfile: ../infra-local/backend/Dockerfile
    container_name: chat-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://chat-mongodb:27017/chat
      REDIS_URL: redis://chat-redis:6379
      MINIO_ENDPOINT: chat-minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      # Public endpoint baked into presigned URLs sent to mobile devices.
      # Android emulator reaches the host via 10.0.2.2.
      # iOS sim → localhost (with host-published 9000), device → host LAN IP.
      MINIO_PUBLIC_HOST: 10.0.2.2
      MINIO_PUBLIC_PORT: "9000"
      MINIO_PUBLIC_USE_SSL: "false"
      MINIO_REGION: us-east-1
      MINIO_ROOT_USER: chatadmin
      MINIO_ROOT_PASSWORD: changeme123
      MINIO_BUCKET: chat-media
      # See backend-dev note: use a peer-reachable host (LAN/public IP), NOT
      # 10.0.2.2. Defaults to localhost; override via shell/.env for real calls.
      COTURN_IP: ${COTURN_IP:-localhost}
      # Internal probe target for /health. COTURN_IP is client-facing and may be
      # a LAN/public IP the backend container cannot route to; the service name
      # always resolves on the compose network. Mirrors MINIO_ENDPOINT vs
      # MINIO_PUBLIC_HOST above.
      COTURN_INTERNAL_HOST: chat-coturn
      COTURN_PORT: "3478"
      TURN_STATIC_SECRET: ${TURN_STATIC_SECRET:-koola-turn-secret-dev-2024}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ── Backend Dev (live reload — run with: docker compose --profile dev up) ──────
  backend-dev:
    image: node:20-alpine
    container_name: chat-backend-dev
    working_dir: /app
    volumes:
      - ../chat-backend/src:/app/src
      - ../chat-backend/node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://chat-mongodb:27017/chat
      REDIS_URL: redis://chat-redis:6379
      MINIO_ENDPOINT: chat-minio
      MINIO_PORT: "9000"
      MINIO_USE_SSL: "false"
      MINIO_PUBLIC_HOST: 10.0.2.2
      MINIO_PUBLIC_PORT: "9000"
      MINIO_PUBLIC_USE_SSL: "false"
      MINIO_REGION: us-east-1
      MINIO_ROOT_USER: chatadmin
      MINIO_ROOT_PASSWORD: changeme123
      MINIO_BUCKET: chat-media
      # COTURN_IP must be an address BOTH call peers can reach (host LAN IP in
      # dev, public IP in prod). Do NOT use 10.0.2.2 here — that alias only
      # resolves on the Android emulator and breaks calls on real devices.
      COTURN_IP: ${COTURN_IP:-localhost}
      COTURN_PORT: "3478"
      # Internal probe target for /health — see the `backend` service note.
      # Not client-facing: this never enters the ICE server list.
      COTURN_INTERNAL_HOST: chat-coturn
      # Single source of truth — must equal the secret coturn loads.
      TURN_STATIC_SECRET: ${TURN_STATIC_SECRET:-koola-turn-secret-dev-2024}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    profiles:
      - dev

volumes:
  mongodb_data:
  redis_data:
  minio_data:
