# Local dev override — NOT for prod.
# MINIO_PUBLIC_HOST must be an address the DEVICE can reach directly over WiFi.
# Re-run `npm run dev:sync-host` (repo root) when the host's LAN IP changes.
# If using USB-only (adb reverse tcp:9000) instead of WiFi, set to localhost.
services:
  backend:
    environment:
      MINIO_PUBLIC_HOST: ${MINIO_PUBLIC_HOST:-localhost}
