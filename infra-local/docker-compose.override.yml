# Local dev override — NOT for prod.
# Makes the backend emit presigned MinIO URLs pointing at localhost:9000 so a
# physical device reached over USB (adb reverse tcp:9000) can load media.
# Works for the emulator too (adb reverse tcp:9000). Delete this file to revert
# to the compose default (10.0.2.2, emulator-only).
services:
  backend:
    environment:
      MINIO_PUBLIC_HOST: localhost
