version: '3.8'

services:
  backend:
    image: node:20-alpine
    container_name: chat-backend
    working_dir: /app
    volumes:
      - ./src:/app/src
    ports:
      - "3000:3000"
    env_file:
      - ../backend/.env
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://host.docker.internal:27017/chat
      - REDIS_URL=redis://host.docker.internal:6379
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: tail -f /dev/null
    # For development: stays running so you can exec in and run nest start
